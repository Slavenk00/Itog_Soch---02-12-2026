<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Литературная шпаргалка</title>
<style>
:root{--bg:#F2F7FC;--card:#FFF;--text:#0F172A;--muted:#64748B;--line:#E2E8F0;--accent:#2563EB;--accent-soft:#DBEAFE;--green:#16A34A;--green-soft:#DCFCE7;--purple:#7C3AED;--purple-soft:#F3E8FF;--orange:#EA580C;--orange-soft:#FFEDD5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:40px}
#home,#structure,#detail{max-width:720px;margin:0 auto;padding:24px 16px 60px}
#structure,#detail{display:none}
.app-title{font-size:26px;font-weight:800;line-height:1.25;margin:0 0 6px}
.app-sub{color:var(--muted);font-size:14px;line-height:1.4;margin:0 0 18px}
.structure-btn{width:100%;display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:22px;border:none;background:linear-gradient(135deg,#7C3AED,#2563EB);color:#fff;cursor:pointer;margin-bottom:18px;box-shadow:0 4px 14px rgba(124,58,237,.3);text-align:left;transition:.15s;font-family:inherit}
.structure-btn:active{transform:scale(.98)}
.structure-btn .icon{font-size:32px;line-height:1}
.structure-btn .txt{flex:1}
.structure-btn .txt b{display:block;font-size:18px;font-weight:850;margin-bottom:2px}
.structure-btn .txt span{display:block;font-size:12px;opacity:.9}
.structure-btn .arrow{font-size:22px;opacity:.8}
.search{width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:16px;outline:none;margin-bottom:12px;font-family:inherit}
.search:focus{border-color:var(--accent)}
.theme-search{border-color:#C4B5FD}
.theme-search:focus{border-color:#7C3AED}
.section-label{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 10px}
.popular-themes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.popular-theme{font-size:13px;font-weight:700;padding:8px 12px;border-radius:999px;background:#F3E8FF;color:#7C3AED;border:1px solid #D8B4FE;cursor:pointer;font-family:inherit}
.popular-theme:active{transform:scale(.96)}
.popular-theme.active{background:#7C3AED;color:#fff;border-color:#7C3AED}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
.work-btn{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px 18px;border-radius:20px;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:.15s;box-shadow:0 1px 2px rgba(15,23,42,.04);font-family:inherit}
.work-btn:active{transform:scale(.98)}
.work-btn .t{font-size:17px;font-weight:800;line-height:1.3;color:var(--text)}
.work-btn .a{font-size:13px;color:var(--muted);font-weight:600}
.work-btn .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tiny-tag{font-size:10px;font-weight:700;padding:4px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.match-badge{display:inline-block;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:#DCFCE7;color:#16A34A;margin-top:6px;align-self:flex-start}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:14px 0 12px;background:linear-gradient(var(--bg) 80%,rgba(242,247,252,0))}
.back-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--text);font-size:14px;font-weight:700;padding:10px 14px;border-radius:999px;cursor:pointer;font-family:inherit}
.back-btn:active{transform:scale(.97)}
.detail-title{font-size:24px;font-weight:850;line-height:1.25;margin:8px 0 4px}
.detail-author{font-size:14px;color:var(--muted);font-weight:700;margin-bottom:18px}
.block{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}
.block h3{font-size:13px;font-weight:850;letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px;color:var(--muted)}
.block p{margin:0 0 10px;font-size:15px;line-height:1.55;color:#1E293B}
.block p:last-child{margin-bottom:0}
.char-line{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.char-line:last-child{border-bottom:none}
.char-name{min-width:110px;font-weight:800;font-size:14px;color:var(--text)}
.char-desc{font-size:14px;line-height:1.45;color:#334155}
.arg-item{padding:12px 14px;border-radius:14px;background:var(--purple-soft);margin-bottom:10px;font-size:14px;line-height:1.55}
.arg-item:last-child{margin-bottom:0}
.arg-item b{color:var(--purple);display:block;margin-bottom:4px}
.theme-chips{display:flex;flex-wrap:wrap;gap:6px}
.theme-chip{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--green-soft);color:var(--green)}
.empty{color:var(--muted);font-size:14px;font-style:italic}
.str-title{font-size:26px;font-weight:850;margin:8px 0 6px;line-height:1.2}
.str-sub{color:var(--muted);font-size:14px;margin-bottom:22px;line-height:1.4}
.str-block{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:16px}
.str-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.str-head .ico{font-size:26px;line-height:1}
.str-head h2{font-size:18px;font-weight:850;margin:0;line-height:1.25}
.str-meta{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--orange-soft);color:var(--orange);margin-bottom:12px}
.str-desc{font-size:14px;line-height:1.5;color:#334155;margin:0 0 12px}
.str-list{list-style:none;padding:0;margin:0}
.str-list li{font-size:14px;line-height:1.55;color:#1E293B;padding:8px 0 8px 26px;position:relative;border-bottom:1px dashed var(--line)}
.str-list li:last-child{border-bottom:none}
.str-list li::before{content:"•";position:absolute;left:8px;top:8px;color:var(--accent);font-weight:800}
.str-list.check li::before{content:"☐";color:var(--green)}
.clich-title{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--purple);margin:16px 0 8px}
.clich-list{display:flex;flex-direction:column;gap:8px;margin:0}
.clich-item{background:#F8FAFC;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.5;color:#1E293B;font-style:italic}
.example-box{background:var(--green-soft);border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.55;color:#14532D;margin-top:14px}
.example-box b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#166534;margin-bottom:6px;font-weight:800}
.wc-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;font-size:14px}
.wc-row .wc-label{flex:1;font-weight:700;color:#1E293B}
.wc-row .wc-val{font-weight:800;color:var(--accent)}
</style>
</head>
<body>

<div id="home">
  <h1 class="app-title">Литературная шпаргалка<br>к итоговому сочинению</h1>
  <p class="app-sub">Структура, клише и разбор 23 произведений — всё для сочинения.</p>

  <button class="structure-btn" onclick="openStructure()">
    <span class="icon">📐</span>
    <span class="txt">
      <b>Структура + клише</b>
      <span>Абзацы, объём, готовые фразы, 2 аргумента</span>
    </span>
    <span class="arrow">→</span>
  </button>

  <input class="search" id="search" type="search" placeholder="Поиск по названию или автору…">
  <input class="search theme-search" id="themeSearch" type="search" placeholder="Поиск по теме: война, любовь, память…">
  <div class="section-label">Популярные темы</div>
  <div class="popular-themes" id="popularThemes"></div>
  <div class="section-label" id="listLabel">Все произведения</div>
  <div class="grid" id="grid"></div>
</div>

<div id="structure">
  <div class="topbar"><button class="back-btn" onclick="goHome()">← Назад</button></div>
  <div id="structureContent"></div>
</div>

<div id="detail">
  <div class="topbar"><button class="back-btn" onclick="goHome()">← Назад</button></div>
  <div id="detailContent"></div>
</div>

"Купец Лопахин предлагает вырубить вишнёвый сад и сдать землю под дачи, но для Раневской сад — символ прошлого.",

characters:[{name:"Раневская",desc:"Живёт прошлым, не может расстаться с садом."},{name:"Гаев",desc:"Пустослов, строит планы, но ничего не делает."},{name:"Лопахин",desc:"Купец-практик, покупает и вырубает сад."},{name:"Петя Трофимов",desc:"«Вечный студент», символизирует будущее."},{name:"Аня",desc:"Дочь Раневской, полна надежд."},{name:"Фирс",desc:"Старый слуга, забытый в запертом доме."}],
result:"Пьеса о смене эпох. Сад — символ красоты, которую нельзя спасти, если жить только прошлым.",
themes:["Память","Красота и выгода","Смена поколений","Ответственность","Прошлое и будущее"],
arguments:["**«Память и забвение»** Фирса забывают в запертом доме — самый жестокий образ пьесы. Раневская и Гаев уезжают, не вспомнив о верном слуге. Чехов показывает: тот, кто живёт только своими переживаниями, теряет связь с людьми. Забвение прошлого оборачивается равнодушием к тем, кто это прошлое создавал.",
"**«Красота и выгода»** Сад прекрасен, но не приносит дохода. Лопахин предлагает вырубить его ради дач — практично, но убивает красоту. Чехов не осуждает никого: оба по-своему правы. Автор ставит вопрос: как сохранить красоту, когда она невыгодна?",
"**«Ответственность»** Раневская и Гаев безответственны: тратят деньги, не думая о будущем. Лопахин действует, но его действия разрушают сад. Чехов показывает: ответственность — не только действие, но и понимание последствий.",
"**«Прошлое и будущее»** Петя и Аня олицетворяют будущее, но их мечты туманны. Петя говорит о труде, но ничего не делает. Чехов иронизирует и над прошлым, и над будущим.",
"**«Смена поколений»** Дворянство уходит, купечество приходит, молодёжь мечтает. Чехов показывает: смена поколений неизбежна, но не всегда безболезненна."]},

{id:"chudesnyy-doktor",title:"Чудесный доктор",author:"А. И. Куприн",tags:["милосердие","надежда"],
summary:["В сочельник семья Мерцаловых живёт в подвале без денег и еды. Девочка тяжело больна, отец на грани отчаяния.",
"В саду Мерцалов встречает незнакомца — доктора Пирогова. Тот идёт в подвал, осматривает девочку, даёт деньги и уходит, не назвав имени.",
"Семья вспоминает эту встречу как чудо. Девочка выздоравливает, жизнь налаживается."],
characters:[{name:"Мерцалов",desc:"Отец, доведённый до отчаяния бедностью."},{name:"Доктор Пирогов",desc:"Врач, бескорыстно спасший семью."},{name:"Жена Мерцалова",desc:"Измученная мать."},{name:"Машутка",desc:"Больная дочь."}],
result:"Милосердие способно изменить жизнь. Помощь приходит в самый трудный момент.",
themes:["Милосердие","Надежда","Маленький человек","Доброта","Отчаяние"],
arguments:["**«Милосердие»** Доктор помогает незнакомой семье, ничего не требуя. Он тратит свои деньги и время, чтобы спасти девочку. Куприн показывает: настоящее милосердие бескорыстно. Пирогов даже не называет своего имени.",
"**«Отчаяние и надежда»** Мерцалов на грани самоубийства, когда встречает доктора. Куприн показывает: надежда появляется, когда её уже не ждёшь. Иногда достаточно одного человека.",
"**«Маленький человек»** Мерцалов задавлен бедностью, но Куприн не смеётся над ним. Бедность не лишает достоинства. Доктор видит в нём отца, а не неудачника.",
"**«Доброта»** Доброта Пирогова конкретна: деньги, рецепт, осмотр. Куприн показывает: настоящая доброта — это поступки, а не слова.",
"**«Случай и судьба»** Встреча случайна, но меняет всю жизнь. Куприн показывает: судьба посылает помощь через незнакомого человека."]},

{id:"yushka",title:"Юшка",author:"А. П. Платонов",tags:["доброта","жестокость"],
summary:["Кузнец Юшка слаб здоровьем, его дразнят и бьют и дети, и взрослые, но он никого не винит.",
"Каждое лето Юшка уходит в Москву — все думают, что тратит деньги на себя. На самом деле он копит их для сироты.",
"Юшка умирает от удара прохожего. Спустя время в город приезжает девушка-врач — та самая сирота. Она лечит людей, продолжая его добро."],
characters:[{name:"Юшка",desc:"Кузнец, терпящий насмешки, помогает сироте."},{name:"Горожане",desc:"Бьют и дразнят Юшку."},{name:"Девушка-врач",desc:"Приёмная дочь, продолжающая его добро."}],
result:"Доброта не требует внешнего блеска. Юшка кажется жалким, но спасает чужую жизнь — и его добро продолжается в других.",
themes:["Доброта","Жестокость","Внешность и суть","Роль личности","Милосердие"],
arguments:["**«Доброта и жестокость»** Юшку бьют, но он никого не винит. Платонов показывает: доброта — не слабость, а сила, не зависящая от обстоятельств. Жестокость других не делает Юшку злым.",
"**«Внешность и суть»** Юшка кажется жалким, но он самый добрый в городе. Платонов показывает: внешность обманчива, а суть раскрывается в поступках.",
"**«Роль личности»** Один человек меняет жизнь другого. Юшка копит деньги для сироты. Платонов показывает: один может изменить мир, если действует по совести.",
"**«Добро продолжается в других»** После смерти Юшки приезжает его приёмная дочь-врач. Платонов показывает: добро не умирает вместе с человеком.",
"**«Смысл жизни»** Юшка живёт тихо, но его жизнь имеет смысл. Платонов показывает: смысл — не в славе, а в добрых поступках."]},

{id:"knopka-knopka",title:"Кнопка, кнопка",author:"Р. Мэтисон",tags:["выбор","алчность","расплата"],
summary:["Норме и Артуру Льюисам приносят коробку с кнопкой под колпаком. Мистер Стюард объясняет: нажатие убьёт незнакомого человека, а они получат 50 000 долларов.",
"Артур отказывается, Норма колеблется: деньги решили бы все их проблемы. После ухода Стюарда Норма восстанавливает визитку и нажимает кнопку.",
"Раздаётся звонок: Артур погиб. Выясняется, что он был застрахован именно на 50 000 долларов. Расплата за «лёгкие» деньги страшна."],
characters:[{name:"Норма Льюис",desc:"Жена, ослеплённая жаждой наживы."},{name:"Артур Льюис",desc:"Муж, проявивший твёрдость, но ставший жертвой."},{name:"Мистер Стюард",desc:"Загадочный посетитель, проверяющий людей."}],
result:"Притча о цене человеческой жизни. За безнравственный поступок всегда придётся платить.",
themes:["Нравственный выбор","Алчность","Цена жизни","Ответственность","Человеческая природа"],
arguments:["**«Нравственный выбор»** Артур сразу отвергает предложение, Норма поддаётся искушению. Мэтисон показывает: суть человека раскрывается в момент выбора.",
"**«Алчность»** Желание получить 50 000 долларов сильнее голоса совести. Норма оправдывает себя мечтами. Мэтисон обнажает разрушительную силу алчности.",
"**«Цена жизни»** Можно ли оценить жизнь незнакомца в 50 000? Для Нормы — да, пока она не понимает последствий. Ирония финала: ценой денег стала жизнь мужа.",
"**«Ответственность»** Норма пытается переложить вину на Стюарда и обстоятельства. Мэтисон показывает: за поступки отвечает сам человек.",
"**«Человеческая природа»** Норма — не злодей, а обычная женщина, которую одолело искушение. В этой обыденности и кроется ужас рассказа."]},

{id:"veld",title:"Вельд",author:"Р. Брэдбери",tags:["технологии","антиутопия"],
summary:["Джордж и Лидия дарят детям «детскую» — комнату, создающую любую реальность. Дети выбирают африканский вельд с львами.",
"Родители замечают, что дети слишком увлечены. Психолог советует отключить комнату, но дети умоляют оставить.",
"Дети запирают родителей в комнате, и львы убивают их. За завтраком Питер и Венди спокойно едят."],
characters:[{name:"Джордж Хедли",desc:"Отец, поздно осознавший опасность."},{name:"Лидия Хедли",desc:"Мать, чувствующая тревогу."},{name:"Питер и Венди",desc:"Дети, для которых вельд реальнее жизни."},{name:"Макклин",desc:"Психолог, предупреждающий об опасности."}],
result:"Технология без контроля разрушает семью. Дети теряют связь с реальностью — и это приводит к трагедии.",
themes:["Технологии","Воспитание","Жестокость","Реальность и иллюзия","Семья"],
arguments:["**«Технологии и человек»** Детская комната заменяет детям реальный мир. Брэдбери показывает: технология начинает управлять человеком.",
"**«Воспитание»** Родители не запрещают вельд, хотя чувствуют опасность. Брэдбери показывает: вседозволенность приводит к катастрофе.",
"**«Жестокость»** Дети убивают родителей и спокойно живут дальше. Брэдбери показывает: технология лишает их сострадания.",
"**«Реальность и иллюзия»** Дети не отличают фантазию от действительности. Брэдбери показывает: иллюзия побеждает реальность.",
"**«Семья»** В семье Хедли нет близости. Вельд заменяет общение. Брэдбери показывает: трагедия — закономерный итог."]},

{id:"vse-leto-v-odin-den",title:"Всё лето в один день",author:"Р. Брэдбери",tags:["зависть","травля"],
summary:["На Венере дожди идут годами, солнце бывает раз в семь лет. Дети живут в подземном городе.",
"Марго прилетела с Земли и помнит солнце. Дети завидуют ей и запирают её в шкафу перед солнечным часом.",
"Дети гуляют под солнцем, а потом вспоминают о Марго — но она уже пропустила чудо."],
characters:[{name:"Марго",desc:"Девочка с Земли, помнящая солнце."},{name:"Дети",desc:"Одноклассники, завидующие и запирающие её."},{name:"Учительница",desc:"Не вмешивается в травлю."}],
result:"Зависть рождает жестокость. Дети, лишённые солнца, лишают его и того, кто помнит свет.",
themes:["Зависть","Травля","Инаковость","Толпа","Жестокость"],
arguments:["**«Зависть»** Дети завидуют Марго и превращают зависть в ненависть. Брэдбери показывает: зависть ослепляет.",
"**«Травля»** Марго — жертва, потому что «другая». Брэдбери показывает: травля рождается из страха перед непохожим.",
"**«Инаковость»** Опыт Марго делает её чужой. Брэдбери показывает: быть другим — не вина, но часто приводит к страданиям.",
"**«Толпа»** Дети действуют как толпа, никто не защищает Марго. Брэдбери показывает: в толпе теряется сострадание.",
"**«Жестокость»** Дети не думают о последствиях. Брэдбери показывает: жестокость рождается из равнодушия."]},

{id:"kanikuly",title:"Каникулы",author:"Р. Брэдбери",tags:["одиночество","свобода"],
summary:["Семья остаётся единственной на опустевшей Земле. Мир принадлежит только им.",
"Взрослые радуются «вечным каникулам»: нет работы, есть свобода. Но сын тоскует по людям.",
"Постепенно приходит понимание: свобода без людей — не радость, а пустота."],
characters:[{name:"Отец",desc:"Радуется свободе, не понимая её цены."},{name:"Мать",desc:"Пытается сохранить быт."},{name:"Сын",desc:"Тоскует по людям."}],
result:"Свобода без людей — не радость, а пустота. Человек не может быть счастлив в одиночестве.",
themes:["Одиночество","Свобода","Ценность обыденного","Ответственность за мир"],
arguments:["**«Одиночество»** Семья одна на всей Земле — и это ад, а не рай. Брэдбери показывает: человек не может жить без других.",
"**«Свобода»** «Вечные каникулы» оказываются пустыми. Брэдбери показывает: свобода без людей теряет смысл.",
"**«Ценность обыденного»** Рутина и дела оказываются важны. Брэдбери показывает: счастье — не в отсутствии обязанностей.",
"**«Ответственность за мир»** Опустевшая Земля — итог ошибок человечества. Брэдбери предупреждает читателя.",
"**«Семья»** Даже в опустевшем мире семья держится вместе. Брэдбери показывает: семьи недостаточно, нужен социум."]},

{id:"podarok",title:"Подарок",author:"Р. Брэдбери",tags:["семья","чудо"],
summary:["Семья летит на ракете на Марс — встречать Рождество.",
"Мальчик переживает: как Санта найдёт его в космосе? Отец обещает особенный подарок.",
"В финале отец показывает сыну чудо — вид на Землю или звёзды. Настоящий подарок — не вещь, а внимание."],
characters:[{name:"Отец",desc:"Хочет подарить сыну чудо, а не вещь."},{name:"Мать",desc:"Хранительница семейного тепла."},{name:"Сын",desc:"Верит в чудо и ждёт подарка."}],
result:"Настоящий подарок — не вещь, а внимание и чудо. Семья и любовь важнее материальных благ.",
themes:["Семья","Чудо","Ценности","Отцовство","Детство"],
arguments:["**«Семья»** Семья летит вместе — это главное. Брэдбери показывает: даже в космосе семья остаётся опорой.",
"**«Чудо»** Отец дарит сыну не игрушку, а вид на звёзды. Брэдбери показывает: настоящее чудо не покупается.",
"**«Ценности»** Материальные подарки теряют смысл рядом с чудом космоса. Брэдбери показывает: истинные ценности — это переживания.",
"**«Отцовство»** Отец старается сделать для сына особенное. Брэдбери показывает: настоящий отец даёт опыт и любовь.",
"**«Детство»** Мальчик верит в Санту. Брэдбери показывает: задача взрослых — сохранить эту веру."]},

{id:"sudba-cheloveka",title:"Судьба человека",author:"М. А. Шолохов",tags:["война","стойкость","гуманизм"],
summary:["Весной 1946 года рассказчик встречает у переправы мужчину с мальчиком. Андрей Соколов рассказывает свою жизнь: работа, любящая жена, дети.",
"На фронте он был ранен и попал в плен. Прошёл голод и унижения, но сохранил достоинство: убил предателя, отказался пить за победу Германии перед Мюллером. Позже бежал, прихватив немецкого майора.",
"После побега узнал: дом разбомбили, жена и дочери погибли, сын Анатолий тоже погиб в День Победы. Оставшись один, Соколов усыновляет мальчика-сироту Ваню — и обретает смысл жизни."],
characters:[{name:"Андрей Соколов",desc:"Шофёр, прошедший плен и потерявший семью."},{name:"Ванюшка",desc:"Мальчик-сирота, которого он усыновил."},{name:"Ирина",desc:"Жена, погибшая при бомбёжке."},{name:"Анатолий",desc:"Сын, погибший 9 мая 1945."},{name:"Мюллер",desc:"Комендант лагеря, оценивший стойкость."}],
result:"Война отняла у Соколова всё, но не сломила его. Он остаётся человеком и дарит любовь чужому ребёнку.",
themes:["Война и человек","Сила духа","Гуманизм","Отцовство","Память о войне","Цена победы"],
arguments:["**«Сила духа»** Соколов проходит плен, голод, потерю семьи. В лагере отказывается пить за победу Германии. Шолохов показывает: сила духа — способность оставаться человеком.",
"**«Гуманизм»** Встретив Ванюшку, Соколов не проходит мимо. Он усыновляет мальчика. Шолохов показывает: человечность — готовность помочь, когда тяжело.",
"**«Война и человек»** Война разрушает жизнь, но Соколов не озлобляется. Шолохов показывает: война может отнять всё, кроме самого человека.",
"**«Отцовство»** Соколов становится отцом для чужого ребёнка. Шолохов показывает: отцовство — готовность взять ответственность.",
"**«Память о войне»** Рассказ Соколова — исповедь для послевоенного поколения. Шолохов показывает: важно помнить и сохранять человечность.",
"**«Цена победы»** Соколов потерял всю семью. Шолохов показывает: за победой стоят личные трагедии."]},

{id:"dary-volhvov",title:"Дары волхвов",author:"О. Генри",tags:["любовь","жертвенность"],
summary:["Делла и Джим — молодая бедная пара. Накануне Рождества у них почти нет денег, но каждый хочет сделать подарок.",
"Делла продаёт волосы, чтобы купить цепочку для часов Джима. Джим продаёт часы, чтобы купить гребни для её волос.",
"Вечером они дарят подарки и понимают: волосы короткие, часы проданы. Но их любовь и готовность жертвовать ценнее вещей."],
characters:[{name:"Делла",desc:"Продаёт волосы ради подарка мужу."},{name:"Джим",desc:"Продаёт часы ради гребней для жены."}],
result:"Настоящая любовь измеряется жертвой, а не ценой подарка.",
themes:["Любовь","Жертвенность","Истинные ценности","Бедность и достоинство"],
arguments:["**«Любовь»** Каждый готов отказаться от самого ценного ради любимого. О. Генри показывает: настоящая любовь — не слова, а поступки.",
"**«Жертвенность»** Оба жертвуют тайно, не рассчитывая на ответ. О. Генри показывает: настоящая жертва не требует награды.",
"**«Истинные ценности»** Цепочка и гребни бесполезны, но именно это доказывает силу любви. О. Генри показывает: вещи теряют смысл рядом с чувствами.",
"**«Бедность и достоинство»** Герои бедны, но не жалуются. О. Генри показывает: бедность не унижает человека.",
"**«Настоящий подарок»** Лучший подарок — готовность отдать последнее. О. Генри показывает: ценность подарка в чувствах."]},

{id:"sashka",title:"Сашка",author:"В. Л. Кондратьев",tags:["война","нравственный выбор"],
summary:["Сашка — молодой солдат под Ржевом. Простой деревенский парень, но на войне проявляется его характер.",

"Повесть показывает: в жестоких условиях человек сохраняет способность к состраданию и нравственному выбору."],
characters:[{name:"Сашка",desc:"Солдат, сохранивший человечность."},{name:"Немецкий солдат",desc:"Пленный, которого Сашка защищает."},{name:"Володька",desc:"Друг Сашки."}],
result:"Сашка остаётся человеком даже на войне. Война не отменяет совести.",
themes:["Война и человек","Нравственный выбор","Сострадание к врагу","Цена победы"],
arguments:["**«Нравственный выбор»** Сашка не убивает безоружного — его останавливает совесть. Кондратьев показывает: выбор на войне — испытание на человечность.",
"**«Война и человек»** Война ожесточает, но Сашка сохраняет сочувствие. Кондратьев показывает: можно остаться человеком в любых условиях.",
"**«Сострадание к врагу»** Сашка видит в пленном человека. Кондратьев показывает: сострадание — свойство души.",
"**«Цена победы»** Нельзя платить за победу потерей человечности. Кондратьев показывает: победа через жестокость теряет смысл.",
"**«Долг и совесть»** Сашка выполняет долг, но не переступает через совесть. Кондратьев показывает: человек должен выбирать.",
"**«Простой человек на войне»** Обычный парень оказывается нравственно выше многих. Кондратьев показывает: сила — в характере."]},

{id:"posledniy-list",title:"Последний лист",author:"О. Генри",tags:["искусство","надежда"],
summary:["Две художницы, Сью и Джонси, живут в маленькой квартирке. Джонси заболевает пневмонией и решает, что умрёт, когда с плюща упадёт последний лист.",
"Старый художник Берман тайно ночью рисует на стене лист плюща — и Джонси верит, что лист держится. Она выздоравливает.",
"Берман умирает от воспаления лёгких, которое получил, пока рисовал лист под дождём."],
characters:[{name:"Джонси",desc:"Художница, потерявшая волю к жизни."},{name:"Сью",desc:"Подруга, заботящаяся о ней."},{name:"Берман",desc:"Художник, создавший «шедевр» ценой жизни."}],
result:"Настоящее искусство способно спасти жизнь. Шедевр — это поступок во имя другого.",
themes:["Искусство и человек","Надежда","Самопожертвование","Цена творчества"],
arguments:["**«Искусство и человек»** Берман рисует лист, чтобы спасти Джонси, а не ради славы. О. Генри показывает: цель искусства — служить человеку.",
"**«Надежда»** Вера в примету определяет судьбу Джонси. О. Генри показывает: надежда может спасти в безнадёжных условиях.",
"**«Самопожертвование»** Берман отдаёт жизнь за чужое спасение. О. Генри показывает: настоящая жертва — готовность отдать последнее.",
"**«Цена творчества»** Настоящее произведение может стоить жизни. О. Генри показывает: творчество — это и жертва.",
"**«Маленький человек и большой поступок»** Незаметный старик совершает подвиг. О. Генри показывает: настоящие герои часто в тени."]},

{id:"mest-lorda-okherst",title:"Месть лорда Окхерста",author:"О. Генри",tags:["ирония","пародия"],

"Рассказ — пародия на викторианские романы. Финал: расчёт и корысть наказаны."],
characters:[{name:"Лорд Окхерст",desc:"Богатый старик, понимающий мотивы жены."},{name:"Леди Окхерст",desc:"Молодая жена, вышедшая из-за денег."}],
result:"Корысть и расчёт не приносят счастья.",
themes:["Корысть","Ирония","Брак по расчёту","Ценности"],
arguments:["**«Корысть»** Молодая жена остаётся ни с чем. О. Генри показывает: расчёт не оправдывается.",

"**«Ценности»** Настоящее богатство — не деньги. О. Генри показывает: материальные блага не спасают от пустоты.",
"**«Возмездие»** Жадность наказывается. О. Генри показывает: зло возвращается к тому, кто его творит."]},

{id:"noch-isceleniya",title:"Ночь исцеления",author:"Б. П. Екимов",tags:["память","милосердие"],
summary:["Бабушка Дуня пережила войну. По ночам ей снятся страшные сны, она кричит.",

"После этого кошмары прекращаются. Доброта и внимание внука исцеляют бабушку."],
characters:[{name:"Баба Дуня",desc:"Пожилая женщина, страдающая от кошмаров."},{name:"Гриша",desc:"Внук, терпеливо помогающий бабушке."}],
result:"Исцеление приходит через любовь и внимание. Молодые должны слышать боль старших.",
themes:["Память о войне","Милосердие","Связь поколений","Забота о близких"],
arguments:["**«Милосердие»** Гриша не отмахивается от бабушки, а лечит её добротой. Екимов показывает: милосердие — это ежедневный труд.",
"**«Связь поколений»** Внук понимает боль бабушки. Екимов показывает: связь поколений — умение слышать друг друга.",
"**«Память о войне»** Война остаётся в памяти бабушки. Екимов показывает: молодые должны бережно относиться к этой памяти.",
"**«Забота о близких»** Гриша каждую ночь приходит к бабушке. Екимов показывает: забота — конкретные действия.",
"**«Исцеление словом»** Разговор оказывается сильнее лекарств. Екимов показывает: участие творит чудеса."]},

{id:"para-osennei-obuvi",title:"Пара осенней обуви",author:"Б. П. Екимов",tags:["семья","забота"],

characters:[{name:"Алексей",desc:"Сын, помнящий о просьбе матери."},{name:"Мартиновна",desc:"Мать Алексея."}],
result:"Забота о родителях — не громкие слова, а конкретные поступки.",
themes:["Семья","Забота о родителях","Нравственные ценности","Внимание к близким"],
arguments:["**«Семья»** Алексей думает о матери в поездке. Екимов показывает: семья — внимание к нуждам близких.",

"**«Мелочи не бывают мелочами»** Простая просьба превращается в поступок сына. Екимов показывает: из мелочей складывается забота.",
"**«Долг перед родителями»** Дети должны отдавать родителям внимание. Екимов показывает: забота о старших — долг каждого."]},

{id:"rodnya",title:"Родня",author:"Б. П. Екимов",tags:["семья","одиночество"],
summary:["Одинокой Катерине дарят мобильный телефон, чтобы она могла связываться с родными.",

"Рассказ поднимает тему одиночества стариков."],
characters:[{name:"Катерина",desc:"Одинокая пожилая женщина."},{name:"Родственники",desc:"Звонят редко."}],

themes:["Одиночество","Семья","Связь поколений","Внимание к старшим"],
arguments:["**«Одиночество»** Катерина одинока, и телефон не заменяет общения. Екимов показывает: одиночество — отсутствие внимания.",

"**«Связь поколений»** Внимание к старшим — сохранение семейной памяти. Екимов показывает: без этого семья теряет силу.",
"**«Внимание к старшим»** Старику нужен звонок, а не подарок. Екимов показывает: простого звонка достаточно.",
"**«Техника не заменит общения»** Телефон есть, а счастья нет. Екимов показывает: техника — лишь средство."]},

{id:"fetisych",title:"Фетисыч",author:"Б. П. Екимов",tags:["детство","ответственность"],

characters:[{name:"Яков (Фетисыч)",desc:"Девятилетний мальчик, ответственный не по годам."},{name:"Учительница",desc:"Умирает, но Фетисыч продолжает её дело."}],

"**«Роль учителя»** Учительница живёт в делах ученика. Екимов показывает: настоящий учитель оставляет след."]},

characters:[{name:"Том",desc:"Мальчик, видящий в картине красоту."},{name:"Толпа",desc:"Люди, ненавидящие прошлое."}],

"**«Память культуры»** Люди без прошлого теряют связь с человечеством. Брэдбери показывает: память — основа цивилизации.",
"**«Красота и толпа»** Один ребёнок прозорливее целого общества. Брэдбери показывает: толпа слепа, человек видит истину."]},

{id:"svecha-gorela",title:"Свеча горела",author:"Майк Гелприн",tags:["литература","антиутопия"],

{id:"lyudi-bez-tel",title:"Люди без тел",author:"К. Воннегут",tags:["технологии","свобода"],

characters:[{name:"Люди с телами",desc:"Сохраняют телесность."},{name:"Амфибии",desc:"Отказались от телесной оболочки."}],

themes:["Технологии","Свобода","Идентичность","Что делает человека человеком"],
arguments:["**«Технологии»** Возможность жить без тела ставит вопрос: что остаётся от человека? Воннегут показывает: технология меняет человека.",

"**«Идентичность»** Тело — часть личности. Воннегут показывает: без тела человек перестаёт быть собой.",
"**«Что делает человека человеком»** Разум без тела — ещё человек? Воннегут показывает: человечность — это и чувства, и опыт.",
"**«Цена прогресса»** Технология упрощает жизнь, но уничтожает то, что делает нас нами. Воннегут предупреждает."]},

{id:"gambrinus",title:"Гамбринус",author:"А. И. Куприн",tags:["искусство","сила духа"],

{id:"taper",title:"Тапер",author:"А. И. Куприн",tags:["искусство","талант"],

const POPULAR_THEMES = ["война","любовь","семья","искусство","милосердие","память","одиночество","сила духа","нравственный выбор","технологии","надежда","ответственность","свобода","доброта","смысл жизни"];

/* ===== DOM ===== */
const grid = document.getElementById("grid");
const searchInput = document.getElementById("search");
const themeInput = document.getElementById("themeSearch");
const listLabel = document.getElementById("listLabel");
const popularEl = document.getElementById("popularThemes");
const homeEl = document.getElementById("home");
const structureEl = document.getElementById("structure");
const detailEl = document.getElementById("detail");
let lastScroll = 0;

/* ===== ЛОГИКА ПОИСКА ===== */
function scoreWork(w,q){
  q=q.toLowerCase().trim();
  if(q.length<2) return {score:0,matched:[]};
  const qW=q.split(/\s+/).filter(x=>x.length>1);
  let s=0; const m=new Set();
  w.themes.forEach(t=>{
    const tl=t.toLowerCase();
    if(tl===q){s+=12;m.add(t)}
    else if(tl.includes(q)){s+=6;m.add(t)}
    else if(q.includes(tl)){s+=5;m.add(t)}
    else qW.forEach(w2=>{if(w2.length>2&&tl.includes(w2)){s+=3;m.add(t)}});
  });
  w.tags.forEach(t=>{
    const tl=t.toLowerCase();
    if(tl===q||tl.includes(q)||q.includes(tl)){s+=4;m.add(t)}
  });
  const at=w.arguments.join(" ").toLowerCase();
  qW.forEach(w2=>{if(w2.length>3&&at.includes(w2)) s+=1});
  return {score:s,matched:[...m]};
}

function renderHome(){
  const q=searchInput.value.trim().toLowerCase();
  const theme=themeInput.value.trim();
  document.querySelectorAll(".popular-theme").forEach(el=>{
    el.classList.toggle("active",el.dataset.theme===theme.toLowerCase());
  });
  let items=WORKS.map(w=>({w}));
  if(q) items=items.filter(x=>x.w.title.toLowerCase().includes(q)||x.w.author.toLowerCase().includes(q));
  if(theme){
    items=items.map(x=>({...x,...scoreWork(x.w,theme)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
    listLabel.textContent=`Лучшие произведения по теме «${theme}»`;
  } else {
    listLabel.textContent = q ? "Результаты поиска" : `Все произведения (${WORKS.length})`;
  }
  grid.innerHTML="";
  if(!items.length){grid.innerHTML=`<p class="empty">Ничего не найдено.</p>`;return}
  items.forEach(({w,matched})=>{
    const btn=document.createElement("button");
    btn.className="work-btn";
    btn.onclick=()=>openWork(w.id);
    const mh = matched && matched.length
      ? `<div class="match-badge">Подходит: ${matched.slice(0,3).join(", ")}</div>`
      : "";
    btn.innerHTML=`<div class="t">${w.title}</div><div class="a">${w.author}</div><div class="tags">${w.tags.map(t=>`<span class="tiny-tag">${t}</span>`).join("")}</div>${mh}`;
    grid.appendChild(btn);
  });
}

function renderPopularThemes(){
  popularEl.innerHTML="";
  POPULAR_THEMES.forEach(t=>{
    const b=document.createElement("button");
    b.className="popular-theme";
    b.dataset.theme=t;
    b.textContent=t;
    b.onclick=()=>{
      themeInput.value = themeInput.value.toLowerCase()===t ? "" : t;
      renderHome();
    };
    popularEl.appendChild(b);
  });
}

/* ===== ЭКРАН ПРОИЗВЕДЕНИЯ ===== */
function openWork(id){
  const w=WORKS.find(x=>x.id===id);
  if(!w) return;
  lastScroll=window.scrollY;
  document.getElementById("detailContent").innerHTML=`
    <h1 class="detail-title">${w.title}</h1>
    <div class="detail-author">${w.author}</div>
    <div class="block"><h3>Краткое содержание</h3>${w.summary.map(p=>`<p>${p}</p>`).join("")}</div>
    <div class="block"><h3>Главные герои</h3>${w.characters.map(c=>`<div class="char-line"><div class="char-name">${c.name}</div><div class="char-desc">${c.desc}</div></div>`).join("")}</div>
    <div class="block"><h3>Итог</h3><p>${w.result}</p></div>
    <div class="block"><h3>Под какие темы</h3><div class="theme-chips">${w.themes.map(t=>`<span class="theme-chip">${t}</span>`).join("")}</div></div>
    <div class="block"><h3>Аргументы</h3>${w.arguments.map(a=>{const p=a.split("**");return`<div class="arg-item"><b>${p[1]||""}</b>${p[2]||""}</div>`}).join("")}</div>
  `;
  homeEl.style.display="none";
  structureEl.style.display="none";
  detailEl.style.display="block";
  window.scrollTo({top:0,behavior:"instant"});
}

/* ===== ЭКРАН СТРУКТУРЫ ===== */
function openStructure(){
  lastScroll=window.scrollY;
  let html=`<h1 class="str-title">${STRUCTURE.title}</h1>`;
  html+=`<p class="str-sub">${STRUCTURE.subtitle}</p>`;

  STRUCTURE.blocks.forEach(b=>{
    html+=`<div class="str-block">`;
    html+=`<div class="str-head"><span class="ico">${b.icon||""}</span><h2>${b.title}</h2></div>`;
    if(b.meta)  html+=`<div class="str-meta">${b.meta}</div>`;
    if(b.desc)  html+=`<p class="str-desc">${b.desc}</p>`;
    if(b.items) html+=`<ul class="str-list">${b.items.map(x=>`<li>${x}</li>`).join("")}</ul>`;
    if(b.phrases){
      html+=`<div class="clich-title">Клише и фразы</div>`;
      html+=`<div class="clich-list">${b.phrases.map(c=>`<div class="clich-item">${c}</div>`).join("")}</div>`;
    }
    if(b.example) html+=`<div class="example-box"><b>Пример</b>${b.example}</div>`;
    if(b.wordCounts){
      html+=b.wordCounts.map(wc=>`<div class="wc-row"><div class="wc-label">${wc.label}</div><div class="wc-val">${wc.val}</div></div>`).join("");
    }
    if(b.checklist){
      html+=`<ul class="str-list check">${b.checklist.map(x=>`<li>${x}</li>`).join("")}</ul>`;
    }
    html+=`</div>`;
  });

  document.getElementById("structureContent").innerHTML=html;
  homeEl.style.display="none";
  detailEl.style.display="none";
  structureEl.style.display="block";
  window.scrollTo({top:0,behavior:"instant"});
}

function goHome(){
  structureEl.style.display="none";
  detailEl.style.display="none";
  homeEl.style.display="block";
  window.scrollTo({top:lastScroll,behavior:"instant"});
}

/* ===== СТАРТ ===== */
searchInput.addEventListener("input",renderHome);
themeInput.addEventListener("input",renderHome);
renderPopularThemes();
renderHome();
</script>
</body>
</html>
